# =============================================================
# Stock Portfolio Tracker - Application Configuration
# =============================================================
# IMPORTANT: Replace all placeholder values before running.
# Never commit real credentials to version control.
# =============================================================

# -------------------------------------------------------
# Database Configuration
# -------------------------------------------------------
# For MySQL:
#   db.url=jdbc:mysql://localhost:3306/portfolio_db?useSSL=false&serverTimezone=UTC
# For SQLite (fallback — no server required):
#   db.url=jdbc:sqlite:portfolio.db
# The application will auto-detect the driver from the URL.
db.url=jdbc:sqlite:portfolio.db
db.username=root
db.password=

# -------------------------------------------------------
# Alpha Vantage API
# -------------------------------------------------------
# Free API key from: https://www.alphavantage.co/support/#api-key
# The free tier allows 25 API calls per day.
# Leave blank to run in offline / demo mode (uses last-known prices).
alpha.vantage.api.key=YOUR_ALPHA_VANTAGE_API_KEY_HERE
alpha.vantage.base.url=https://www.alphavantage.co/query

# -------------------------------------------------------
# Background Price Refresh
# -------------------------------------------------------
# How often (in seconds) to refresh all stock prices in the background.
# Minimum recommended: 60s (to avoid rate-limiting on the free tier).
refresh.interval.seconds=60

# -------------------------------------------------------
# Alert System
# -------------------------------------------------------
# Default percentage change threshold to trigger a price alert.
# E.g., 5.0 means alert fires when price moves >= 5% from previous refresh.
default.alert.threshold=5.0

# -------------------------------------------------------
# Risk Analysis
# -------------------------------------------------------
# Holdings above this percentage of total portfolio value are flagged.
concentration.risk.threshold=40.0

# -------------------------------------------------------
# Logging
# -------------------------------------------------------
# Path to the file-based alert log.
alert.log.file=alerts.log
